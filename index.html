<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myflx Clone : Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="page page__home">
  <nav class="nav">
    <a class="nav__link" href="index.html">
      <img class="nav__logo" src="./assets/img/logo-myflx.png" alt="logo Myflx" />
    </a>
  </nav>

  <div class="content">
    <div class="row">
      <form class="form" action="profil.html">
        <h2 class="subtitle">S'identifier</h2>

        <input class="form__input" type="email" placeholder="Entrez votre E-mail" />
        <input class="form__input" type="password" placeholder="Entrez votre password" />
        <input class="form__input form__input--submit" type="submit" value="connexion" />

        <p class="form__text">
          <input class="form__input" type="checkbox" id="save" />
          <label class="form__label" for="save">Se souvenir de moi</label>
        </p>

        <p class="form__text">
          Première visite sur Myflx ?
          <a class="form__link" href="#">Inscrivez-vous</a>
        </p>
      </form>
    </div>
  </div>
</body>

</html>
